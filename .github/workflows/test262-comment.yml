name: Test262 comment

# CI runs on pull_request, so it cannot comment on PRs from forks. This
# workflow runs in the context of the base repository after CI completes.
# The artifact it downloads is generated by code from the PR, so it must be
# treated as untrusted and never executed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}

jobs:
  test262-comment:
    name: Create or update test262 results comment
    runs-on: ubuntu-latest
    if: |
      github.repository == 'babel/babel' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read # to download artifacts from the CI run
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download test262 comment data
        id: download
        # The artifact is missing if CI failed before running test262
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test262-comment-data
          path: ${{ runner.temp }}/test262-comment-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v9
        if: steps.download.outcome == 'success'
        env:
          DATA_DIR: ${{ runner.temp }}/test262-comment-data
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { default: test262Comment } = await import('${{ github.workspace }}/scripts/actions/test262-comment.ts');
            await test262Comment(github, context, process.env.DATA_DIR);
