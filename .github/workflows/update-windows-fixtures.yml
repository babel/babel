name: Update Windows Fixtures

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull Request number
        required: true

permissions:
  contents: read

jobs:
  update-windows-fixtures:
    permissions:
      contents: read # to fetch code
      pull-requests: read # to get PR metadata
    runs-on: windows-latest
    steps:
      - name: Get Pull Request branch
        uses: actions/github-script@v9
        id: pr-meta
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PULL_REQUEST),
            });

            const {
              ref: branch,
              repo: { full_name: repository }
            } = pullRequest.head;

            core.setOutput("branch", branch);
            core.setOutput("repository", repository);

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr-meta.outputs.repository }}
          ref: ${{ steps.pr-meta.outputs.branch }}
          fetch-depth: 0 # Otherwise we cannot push
          persist-credentials: false # So that we can push with BOT_TOKEN, otherwise it doesn't trigger CI

      - name: Use Node.js latest
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "yarn"

      - name: Install and build
        # make bootstrap modifies some files (babel-runtime-*/package.json), so we reset them
        run: |
          make -j bootstrap
          git reset --hard HEAD

      - name: Regenerate fixtures
        run: |
          yarn jest -u --ci || true
        env:
          BABEL_ENV: test
          OVERWRITE: true

      - name: Commit updates
        # The branch name is chosen by the PR author, and can contain shell
        # metacharacters. Never interpolate it (or any other ${{ }} expression)
        # in the script: pass values as environment variables instead.
        # NOTE: This runs in PowerShell, so they are read as ${env:NAME}.
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REPOSITORY: ${{ steps.pr-meta.outputs.repository }}
          BRANCH: ${{ steps.pr-meta.outputs.branch }}
        run: |
          git config user.name "Babel Bot"
          git config user.email "babel-bot@users.noreply.github.com"
          git add .
          git commit -m "Update fixtures (Windows)" --no-verify --quiet
          git push "https://babel-bot:${env:BOT_TOKEN}@github.com/${env:REPOSITORY}.git" "HEAD:refs/heads/${env:BRANCH}"
