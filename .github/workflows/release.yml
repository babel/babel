name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        # Often minor versions require human intervention, so it's safer if we
        # force ourselves to always create them locally.
        description: ⚠️ This workflow can only automatically release patch versions, or Babel 8 pre-releases
        required: true
        default: patch
        type: choice
        options:
          - prerelease
          - patch
          - "8.0.0"
      abort-last-release:
        # A string instead of a checkbox, so that a release cannot be aborted
        # by a misclick.
        description: Abort the last release instead of creating a new one. Type its tag (e.g. v8.1.4). Only possible when none of its packages are on npm yet.
        required: false
        type: string

permissions:
  contents: read

jobs:
  log-updates:
    name: Log packages to publish
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.abort-last-release == ''
    steps:
      - name: Checkout the new tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: This release will publish the following packages
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            yarn release-tool version --dry ${{ github.event.inputs.version }}
          else
            git diff --name-only HEAD^..HEAD
          fi;

  ensure-npm-packages-exist:
    name: Ensure npm packages exist
    runs-on: ubuntu-latest
    # Only needed before publishing, and a workflow_dispatch run does not
    # publish. If a package is missing, the tag-triggered run fails here before
    # publishing anything, and can be re-run once the package has been created.
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js latest
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - name: Ensure npm packages exist
        run: |
          node ./scripts/ensure-packages-exist.ts --check-only

  git-version:
    name: Create git tag and commit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.abort-last-release == ''
    # Holds the credentials of the release GitHub App
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise the persisted GITHUB_TOKEN is used instead of the token in the push URL
          persist-credentials: false

      - name: Set @babel-bot as committer
        run: |
          git config user.name "Babel Bot"
          git config user.email "babel-bot@users.noreply.github.com"

      - name: Create new version
        run: |
          make new-version-checklist
          yarn release-tool version -f @babel/standalone --yes ${{ github.event.inputs.version }}

      - name: Get the new tag name
        id: tag-name
        run: |
          tag="$(git describe --exact-match)"
          echo "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The release GitHub App is exempt from the merge queue ruleset and from
      # the `v*` tag ruleset, so it can push the release commit directly to the
      # branch and create the tag.
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # If the branch has moved since this workflow started, the push is
      # rejected as non-fast-forward and nothing is released. The push is
      # atomic, so the tag is never created without the branch update.
      #
      # Unlike a tag pushed with GITHUB_TOKEN, the tag pushed with the app
      # token triggers this workflow through `on: push: tags`, and that run
      # builds and publishes the release. Its commit is the release commit,
      # so the npm provenance points to it instead of to its parent.
      - name: Push to GitHub
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag-name.outputs.tag }}
        run: |
          git push --atomic "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${GITHUB_REF}" "refs/tags/${TAG}"

  # Undoes `git-version` for a release whose tag-triggered run failed before
  # publishing and cannot be fixed by re-running it. Releasing the next version
  # instead would skip the packages of the failed one, because only the
  # packages modified in the release commit are published.
  abort-release:
    name: Abort the last release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.abort-last-release != ''
    # Holds the credentials of the release GitHub App
    environment: release
    permissions:
      contents: read
      actions: read # to list the workflow runs of the tag
    env:
      TAG: ${{ inputs.abort-last-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise the persisted GITHUB_TOKEN is used instead of the token in the push URL
          persist-credentials: false
      - name: Use Node.js latest
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false

      - name: Check that the tag is the last release
        run: |
          # The revert is pushed to the ref that this workflow runs on
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow from the branch that $TAG was released from, not from a tag"
            exit 1
          fi
          last="$(git describe --abbrev=0 --match "v*")"
          if [ "$TAG" != "$last" ]; then
            echo "::error::\"$TAG\" is not the last release on \"$GITHUB_REF_NAME\", which is $last"
            exit 1
          fi

      # Such a run could still publish the release after it has been aborted
      - name: Check that no workflow run is releasing the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event push --branch "$TAG" \
              --json status,url --jq '.[] | select(.status != "completed") | .url'
          )"
          if [ -n "$active" ]; then
            echo "::error::Cancel the workflow run that is releasing $TAG first: $active"
            exit 1
          fi

      # Twice, because a package that has just been published, for example by
      # a run that was cancelled a moment ago, may not be visible yet.
      - name: Check that nothing has been published to npm
        run: |
          for attempt in 1 2; do
            statuses="$(node ./scripts/release-npm-status.ts "$TAG")"
            if published="$(grep '^published' <<< "$statuses")"; then
              echo "$published"
              echo "::error::$TAG cannot be aborted, some of its packages are already on npm"
              exit 1
            fi
            if [ "$attempt" != 2 ]; then
              sleep 30
            fi
          done

      - name: Revert the release commit
        run: |
          git config user.name "Babel Bot"
          git config user.email "babel-bot@users.noreply.github.com"
          commit="$(git rev-parse "$TAG^{commit}")"
          git revert --no-commit "$commit"
          git commit -m "Revert \"$TAG\" [skip ci]" -m "This reverts commit $commit." --no-verify --quiet

      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # If the branch has moved since this workflow started, the push is
      # rejected as non-fast-forward and nothing is aborted. The push is
      # atomic, so the tag is never deleted without the revert.
      - name: Push to GitHub
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push --atomic "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${GITHUB_REF}" ":refs/tags/${TAG}"
          # `git fetch` neither deletes this tag from a clone that already has
          # it, nor updates it when the version is released again
          echo "::notice::$TAG has been deleted. If you have already fetched it, run \"git tag -d $TAG\" before the next release."

  npm-release:
    name: Build, Test and Publish
    runs-on: ubuntu-latest
    needs:
      - ensure-npm-packages-exist
    # A workflow_dispatch run only creates and pushes the tag, see git-version
    if: github.event_name == 'push'
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js latest
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          package-manager-cache: false # Never use the cache in release builds to avoid cache poisoning.

      - name: Set @babel-bot as committer
        run: |
          git config user.name "Babel Bot"
          git config user.email "babel-bot@users.noreply.github.com"

      - name: Build and Test
        run: make prepublish
        env:
          # Hack: use FORCE_COLOR so that supports-color@5 returns true for GitHub CI
          # Remove once `chalk` is bumped to 4.0.
          FORCE_COLOR: true

      # This run may have been started, or re-run, for a release that has been
      # aborted since: the checkout still finds its commit after the tag is gone.
      - name: Check that the release has not been aborted
        run: |
          # Not in a pipeline, which would hide a failure of `git ls-remote`
          refs="$(git ls-remote origin "$GITHUB_REF" "$GITHUB_REF^{}")"
          tagged="$(tail -n 1 <<< "$refs" | cut -f 1)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME no longer points to $GITHUB_SHA on GitHub"
            exit 1
          fi

      # Whether this run has anything to publish, for the check after publishing
      - name: Check which packages are already on npm
        id: npm-status
        run: |
          statuses="$(node ./scripts/release-npm-status.ts HEAD)"
          echo "$statuses"
          if grep -q '^missing' <<< "$statuses"; then
            echo "has-missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        # A failure is judged by the next step
        continue-on-error: true
        run: yarn release-tool publish --yes --provenance

      # Publishing is neither atomic nor repeatable. If only some packages were
      # published, re-running this job publishes the missing ones, but the
      # step above still fails because npm rejects the ones it already has.
      # That failure is accepted when this run had packages to publish and
      # every package of the release is on npm afterwards.
      #
      # A run that had nothing to publish keeps failing. Otherwise re-running
      # all jobs of a finished release would repeat the jobs after this one,
      # which draft the GitHub release and push CHANGELOG.md.
      - name: Check that all packages are on npm
        if: steps.publish.outcome == 'failure'
        env:
          HAD_MISSING: ${{ steps.npm-status.outputs.has-missing }}
        run: |
          if [ "$HAD_MISSING" != "true" ]; then
            echo "::error::Publishing failed, and every package of this release was already on npm before this run"
            exit 1
          fi
          # A package that has just been published may not be visible yet, and
          # a lookup may fail, so try for a while
          missing=""
          for attempt in 1 2 3 4 5; do
            if statuses="$(node ./scripts/release-npm-status.ts HEAD)"; then
              if ! missing="$(grep '^missing' <<< "$statuses")"; then
                exit 0
              fi
            fi
            if [ "$attempt" != 5 ]; then
              sleep 30
            fi
          done
          echo "$missing"
          echo "::error::Not every package of this release could be found on npm"
          exit 1

      - name: Generate babel-types docs
        continue-on-error: true
        run: |
          mkdir build
          node ./packages/babel-types/scripts/generators/docs.ts > ./build/types.md

      - name: Upload babel-types docs
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: babel-types-docs
          path: build/types.md
          retention-days: 3

  github-release:
    name: Create GitHub release draft
    runs-on: ubuntu-latest
    # After publishing, so that a release that is aborted has no draft
    needs:
      - npm-release
    # A workflow_dispatch run only creates and pushes the tag, see git-version
    if: github.event_name == 'push'
    outputs:
      is-main: ${{ steps.is-main.outputs.result }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.tags.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Not whether the tag is the tip of "main": other commits may have been
      # merged since the tag was pushed.
      - name: Check if releasing from main
        id: is-main
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get tag info
        id: tags
        uses: babel/actions/get-release-tags@v2
        with:
          prefix: v8

      - name: Generate the changelog
        id: changelog
        uses: babel/actions/generate-lerna-changelog@v2
        with:
          from: ${{ steps.tags.outputs.old }}
          to: ${{ steps.tags.outputs.new }}
          filter: v8
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a draft GitHub release
        uses: babel/actions/publish-github-release@v2
        with:
          tag: ${{ steps.tags.outputs.new }}
          changelog: ${{ steps.changelog.outputs.changelog }}
          token: ${{ secrets.BOT_TOKEN }}

  github-push:
    name: Push CHANGELOG.md to "main"
    runs-on: ubuntu-latest
    needs:
      - npm-release
      - github-release
    if: needs.github-release.outputs.is-main == 'true'
    # Holds the credentials of the release GitHub App. It runs for a `v*` tag,
    # so the environment must allow `v*` tags, and the tag ruleset must keep
    # anyone else from creating them.
    environment: release
    steps:
      # The release commit and tag are already on GitHub, so this job only adds
      # the CHANGELOG.md commit on top of the current "main".
      - uses: actions/checkout@v7
        with:
          ref: main
          # Otherwise the persisted GITHUB_TOKEN is used instead of the token in the push URL
          persist-credentials: false

      - name: Update CHANGELOG.md
        uses: babel/actions/update-changelog@v2
        with:
          changelog: ${{ needs.github-release.outputs.changelog }}
          filename: CHANGELOG.md

      - name: Commit CHANGELOG.md
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          # Not `git -c`: the push step may need the identity to rebase this commit
          git config user.name "Babel Bot"
          git config user.email "babel-bot@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Add ${VERSION} to CHANGELOG.md [skip ci]" --no-verify --quiet

      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # "main" may have moved since the checkout. The CHANGELOG.md commit is not
      # tagged, so it is safe to rebase it on top of the new commits.
      - name: Push to GitHub
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for _ in 1 2 3; do
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            git pull --rebase "$remote" main
          done
          exit 1

  types-docs-updates:
    name: Update Babel types docs
    runs-on: ubuntu-latest
    needs:
      - github-release
      - github-push
    if: |
      always() &&
      needs.github-push.result == 'success' &&
      needs.github-release.result == 'success' &&
      needs.github-release.outputs.is-main == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: babel/website
          fetch-depth: 0 # Otherwise we cannot push
          persist-credentials: false # So that we can push with BOT_TOKEN, otherwise it doesn't trigger CI
      - name: Download babel-types docs
        uses: actions/download-artifact@v8
        with:
          name: babel-types-docs
          # Downloaded as ./docs/types.md
          path: docs
      - name: Commit Babel website changes
        id: prepare-website-changes
        run: |
          if [[ -z "$(git status --porcelain=v1 2>/dev/null)" ]]
          then
            echo "No babel-types docs changes."
            exit 0
          else
            echo "hasChanges=true" >> $GITHUB_OUTPUT
          fi
          git checkout -b update-types-docs
          git config user.name "Babel Bot"
          git config user.email "babel-bot@users.noreply.github.com"
          git commit -am "docs: update babel types"
          git push --force "https://babel-bot:${{ secrets.BOT_TOKEN }}@github.com/babel/website.git" update-types-docs
      - name: Create Pull Request
        uses: babel/actions/create-pull-request@v2
        if: steps.prepare-website-changes.outputs.hasChanges == 'true'
        with:
          token: ${{ secrets.BOT_TOKEN }}
          repository: babel/website
          branch: update-types-docs
          base: main
          title: Update Babel types docs
          description: Updated `@babel/types` docs for [Babel ${{ needs.github-release.outputs.version }}](https://github.com/babel/babel/releases/tag/${{ needs.github-release.outputs.version }}).
          labels: |
            docs
            repo automation :robot:
