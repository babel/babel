name: Test @babel/runtime on a Node.js version
description: Switch to the given Node.js version and run the runtime integration tests.
inputs:
  node-version:
    description: The Node.js version to test on.
    required: true
runs:
  using: composite
  steps:
    # Only node is needed from here on, so skip check-latest and caching.
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Test Node.js ${{ inputs.node-version }}
      shell: bash
      run: node test/runtime-integration/node.cjs
